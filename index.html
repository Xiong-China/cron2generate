<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020"><meta name="description" content="免费在线 Cron 表达式生成器。通过可视化配置生成、解析和复制Unix Cron 与 Quartz Cron 表达式。">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>Cron Studio — Cron 表达式生成器</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#121a2e;--panel2:#17223a;--line:#26334d;--text:#edf2ff;--muted:#8f9db8;--blue:#7c9cff;--cyan:#6de0d2;--green:#9ae6b4;--shadow:0 24px 70px #0005}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% -10%,#1d3157 0,transparent 42%),radial-gradient(ellipse at 95% 10%,#153a43 0,transparent 35%),var(--bg);color:var(--text);font:15px/1.6 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100vh}
button,input,select{font:inherit}button{cursor:pointer}.wrap{max-width:1120px;margin:auto;padding:34px 24px 64px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:56px}.brand{display:flex;align-items:center;gap:12px;font-weight:750;letter-spacing:.2px}.logo{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#8aa7ff,#55d7c5);display:grid;place-items:center;color:#0b1527;font-weight:900;font-size:19px}.tag{color:var(--muted);font-size:13px;border:1px solid var(--line);border-radius:30px;padding:6px 12px}.hero{text-align:center;margin-bottom:34px}.eyebrow{color:var(--cyan);font-size:12px;letter-spacing:2.5px;font-weight:750}.hero h1{font-size:clamp(30px,5vw,48px);letter-spacing:-1.7px;margin:10px 0 8px;line-height:1.15}.hero p{color:var(--muted);margin:0}.layout{display:grid;grid-template-columns:1.12fr .88fr;gap:18px;align-items:start}.card{background:linear-gradient(160deg,#151f35f2,#10182aF2);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}.card-head{padding:20px 22px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.card-head h2{font-size:16px;margin:0}.sub{color:var(--muted);font-size:12px}.body{padding:22px}.presets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}.chip{background:#1a2740;border:1px solid #2b3b5b;color:#b9c8e5;padding:7px 11px;border-radius:9px;font-size:12px}.chip:hover,.chip.active{border-color:var(--blue);color:white;background:#24375d}.field{padding:15px 0;border-bottom:1px solid #243049}.field:last-child{border:0}.field-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:11px}.field label{font-weight:650;font-size:14px}.field small{color:var(--muted);font-size:12px}.mode{display:flex;gap:5px;background:#0c1425;padding:3px;border-radius:8px}.mode button{border:0;background:transparent;color:var(--muted);font-size:11px;padding:4px 8px;border-radius:6px}.mode button.on{background:#293b5e;color:#fff}.control{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.control input,.control select,.raw-input{background:#0b1426;border:1px solid #2c3b57;color:var(--text);border-radius:8px;padding:9px 11px;outline:none;min-width:0}.control input:focus,.raw-input:focus{border-color:var(--blue)}.control input[type=number]{width:82px}.control input[type=text]{width:100%;max-width:240px}.hint{color:var(--muted);font-size:11px;margin-top:8px}.days{display:flex;gap:7px;flex-wrap:wrap}.day{width:37px;height:34px;border:1px solid #34435f;border-radius:8px;background:#101a2d;color:#aebbd2;font-size:12px}.day.selected{background:#304b7c;border-color:#86a4ff;color:white}.output{position:sticky;top:20px}.output .body{padding:22px}.expression{background:#091222;border:1px solid #2a3d60;border-radius:13px;padding:19px 16px;margin:12px 0 15px}.cron{font:600 clamp(21px,3vw,29px)/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:1px;color:#a9c0ff;overflow-wrap:anywhere}.parts{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-top:16px}.part{text-align:center;color:var(--muted);font-size:10px}.part b{display:block;color:#dce6ff;font:600 12px ui-monospace,monospace;margin-bottom:2px}.actions{display:flex;gap:9px}.primary,.secondary{border-radius:9px;padding:10px 14px;font-weight:650;font-size:13px}.primary{background:linear-gradient(120deg,#8ba7ff,#6dd9d0);border:0;color:#0b1424;flex:1}.secondary{background:#1a2740;border:1px solid #34435f;color:#dce6ff}.description{margin-top:18px;padding:13px 14px;border-radius:10px;background:#15253a;color:#c4d3ec;font-size:13px}.next{margin-top:20px}.next h3{font-size:13px;margin:0 0 10px}.times{display:grid;gap:7px}.time{display:flex;justify-content:space-between;color:#b9c7df;font:12px ui-monospace,monospace;padding:7px 9px;background:#0d1729;border-radius:7px}.time span:last-child{color:var(--muted)}.raw{margin-top:18px}.raw label{display:block;font-size:12px;color:var(--muted);margin-bottom:7px}.raw-input{width:100%;font:13px ui-monospace,monospace}.status{font-size:12px;color:var(--green);min-height:18px;margin-top:8px}.footer{text-align:center;color:#65738e;font-size:12px;margin-top:30px}.footer a{color:#91a9e9;text-decoration:none}
@media(max-width:800px){.layout{grid-template-columns:1fr}.output{position:static}.top{margin-bottom:38px}.wrap{padding:22px 15px 42px}}@media(max-width:420px){.tag{display:none}.body{padding:16px}.parts{gap:2px}.cron{font-size:22px}}
</style>
</head>
<body><main class="wrap">
<header class="top"><div class="brand"><div class="logo">C</div><span>Cron Studio</span></div><span class="tag">免费 · 本地运行 · 无需登录</span></header>
<section class="hero"><div class="eyebrow">SCHEDULE MADE SIMPLE</div><h1>Cron 表达式生成器</h1><p>用可视化方式创建定时任务，实时预览并复制 Cron 表达式。</p></section>
<div class="layout">
<section class="card"><div class="card-head"><h2>配置执行计划</h2><select id="cronType" class="secondary" aria-label="表达式类型"><option value="unix">Unix Cron · 5 段</option><option value="quartz">Quartz · 6 段</option></select></div><div class="body">
<div class="presets" id="presets"><button class="chip active" data-preset="everyMinute">每分钟</button><button class="chip" data-preset="every5">每 5 分钟</button><button class="chip" data-preset="hourly">每小时</button><button class="chip" data-preset="daily">每天 09:00</button><button class="chip" data-preset="weekday">工作日 09:00</button><button class="chip" data-preset="weekly">每周一</button><button class="chip" data-preset="monthly">每月 1 日</button></div>
<div id="fields"></div>
</div></section>
<aside class="card output"><div class="card-head"><h2>生成结果</h2><span class="sub">实时更新</span></div><div class="body">
<div class="sub">CRON EXPRESSION</div><div class="expression"><div class="cron" id="cron">* * * * *</div><div class="parts" id="parts"><div class="part"><b>*</b>分钟</div><div class="part"><b>*</b>小时</div><div class="part"><b>*</b>日期</div><div class="part"><b>*</b>月份</div><div class="part"><b>*</b>星期</div></div></div>
<div class="actions"><button class="primary" id="copy">复制 Cron 表达式</button><button class="secondary" id="reset">重置</button></div>
<div class="description" id="desc">每分钟执行一次</div>
<div class="next"><h3>接下来 5 次执行时间 <span class="sub">（本地时区）</span></h3><div class="times" id="times"></div></div>
<div class="raw"><label for="raw">也可以直接编辑表达式</label><input class="raw-input" id="raw" value="* * * * *" spellcheck="false"><div class="status" id="status" aria-live="polite"></div></div>
</div></aside>
</div><footer class="footer">Cron Studio · 表达式在浏览器本地生成，不会上传任何数据。<br>适用于 Linux Cron、Cloudflare 等常见定时任务场景（请确认目标平台语法）。</footer>
</main>
<script>
const $=id=>document.getElementById(id);
let cronType='unix';
const common=[{key:'minute',title:'分钟',min:0,max:59,range:'0–59'},{key:'hour',title:'小时',min:0,max:23,range:'0–23'},{key:'dom',title:'日期',min:1,max:31,range:'1–31'},{key:'month',title:'月份',min:1,max:12,range:'1–12'},{key:'dow',title:'星期',min:0,max:6,range:'0–6（周日为 0）'}];
const quartz=[{key:'second',title:'秒',min:0,max:59,range:'0–59'},{key:'minute',title:'分钟',min:0,max:59,range:'0–59'},{key:'hour',title:'小时',min:0,max:23,range:'0–23'},{key:'dom',title:'日期',min:1,max:31,range:'1–31（可用 ?）'},{key:'month',title:'月份',min:1,max:12,range:'1–12'},{key:'dow',title:'星期',min:1,max:7,range:'1–7（1=周日，可用 ?）'}];
const state={second:{mode:'specific',a:0,b:0},minute:{mode:'every',a:1,b:0},hour:{mode:'every',a:1,b:0},dom:{mode:'every',a:1,b:1},month:{mode:'every',a:1,b:1},dow:{mode:'every',a:1,b:0}};
const defs=()=>cronType==='unix'?common:quartz;
function value(k){const s=state[k];if(s.mode==='every')return '*';if(s.mode==='step')return '*/'+s.a;if(s.mode==='range')return s.a+'-'+s.b;if(s.mode==='question')return '?';return String(s.a)}
function renderFields(){ $('fields').innerHTML=defs().map(d=>{let s=state[d.key],modes=[['every','每'+d.title],['step','间隔'],['specific','指定值'],['range','范围']];if(cronType==='quartz'&&(d.key==='dom'||d.key==='dow'))modes.push(['question','不指定 (?)']);return '<div class="field"><div class="field-top"><label>'+d.title+'</label><small>'+d.range+'</small></div><div class="mode">'+modes.map(([m,t])=>'<button data-key="'+d.key+'" data-mode="'+m+'" class="'+(s.mode===m?'on':'')+'">'+t+'</button>').join('')+'</div><div class="control" style="margin-top:10px">'+(s.mode==='step'?'<span>每隔</span><input type="number" min="1" max="'+(d.max-d.min+1)+'" value="'+s.a+'" data-key="'+d.key+'" data-prop="a"><span>'+d.title+'</span>':s.mode==='specific'?'<span>指定</span><input type="number" min="'+d.min+'" max="'+d.max+'" value="'+s.a+'" data-key="'+d.key+'" data-prop="a">':s.mode==='range'?'<span>从</span><input type="number" min="'+d.min+'" max="'+d.max+'" value="'+s.a+'" data-key="'+d.key+'" data-prop="a"><span>到</span><input type="number" min="'+d.min+'" max="'+d.max+'" value="'+s.b+'" data-key="'+d.key+'" data-prop="b">':s.mode==='question'?'<span style="color:#91a2c0;font-size:13px">该字段由另一个日期字段决定</span>':'<span style="color:#91a2c0;font-size:13px">每'+d.title+'执行</span>')+'</div></div>'}).join('');update()}
$('fields').addEventListener('click',e=>{let b=e.target.closest('button[data-mode]');if(!b)return;state[b.dataset.key].mode=b.dataset.mode;renderFields()});
$('fields').addEventListener('change',e=>{let i=e.target;if(!i.dataset.key)return;let d=defs().find(x=>x.key===i.dataset.key),n=Number(i.value);state[i.dataset.key][i.dataset.prop]=Math.max(d.min,Math.min(d.max,n));renderFields()});
function parseField(f,min,max,allowQuestion=false){if(f==='?'&&allowQuestion)return null;if(f==='*')return Array.from({length:max-min+1},(_,i)=>i+min);let out=[];for(let p of f.split(',')){let [base,stepS]=p.split('/'),step=stepS?Number(stepS):1;if(!Number.isInteger(step)||step<1)throw Error('间隔值无效');let a,b;if(base==='*'){a=min;b=max}else if(base.includes('-')){[a,b]=base.split('-').map(Number)}else{a=b=Number(base)}if(!Number.isInteger(a)||!Number.isInteger(b)||a<min||b>max||a>b)throw Error('字段数值超出范围');for(let x=a;x<=b;x+=step)out.push(x)}return [...new Set(out)]}
function validCron(c){let f=c.trim().split(/\s+/),expected=cronType==='unix'?5:6;if(f.length!==expected)throw Error('当前格式必须包含 '+expected+' 个字段');let ranges=cronType==='unix'?[[0,59],[0,23],[1,31],[1,12],[0,7]]:[[0,59],[0,59],[0,23],[1,31],[1,12],[1,7]];let parsed=f.map((x,i)=>parseField(x,...ranges[i],cronType==='quartz'&&(i===3||i===5)));if(cronType==='quartz'&&((f[3]==='?')===(f[5]==='?')))throw Error('Quartz 格式的日期和星期字段必须且只能有一个使用 ?');return {f,parsed}}
function describe(f){return f.join(' ')}
function nextRuns(f){let q=cronType==='quartz',offset=q?1:0,sec=q?parseField(f[0],0,59):[0],mins=parseField(f[offset],0,59),hours=parseField(f[offset+1],0,23),dom=parseField(f[offset+2],1,31,q),months=parseField(f[offset+3],1,12),dow=parseField(f[offset+4],q?1:0,7,q);if(!q)dow=dow.map(x=>x===7?0:x);let result=[],d=new Date();d.setMilliseconds(0);if(q){d.setSeconds(d.getSeconds()+1)}else{d.setSeconds(0);d.setMinutes(d.getMinutes()+1)}let limit=d.getTime()+366*86400000;for(let t=d.getTime();t<limit&&result.length<5;){let x=new Date(t),weekday=q?x.getDay()+1:x.getDay(),dayMatch=q?(dom===null?dow.includes(weekday):dom.includes(x.getDate())):((f[2]==='*'&&f[4]==='*')?true:f[2]==='*'?dow.includes(weekday):f[4]==='*'?dom.includes(x.getDate()):(dom.includes(x.getDate())||dow.includes(weekday)));if(sec.includes(x.getSeconds())&&mins.includes(x.getMinutes())&&hours.includes(x.getHours())&&months.includes(x.getMonth()+1)&&dayMatch)result.push(x);t+=q?1000:60000}return result}
function update(){let f=defs().map(d=>value(d.key)),c=f.join(' ');$('cron').textContent=c;$('raw').value=c;$('parts').style.gridTemplateColumns='repeat('+f.length+',1fr)';$('parts').style.gridTemplateColumns='repeat('+f.length+',1fr)';$('parts').innerHTML=f.map((x,i)=>'<div class="part"><b>'+x+'</b>'+defs()[i].title+'</div>').join('');$('desc').textContent=(cronType==='quartz'?'Quartz 六段表达式：':'Unix 五段表达式：')+c;try{let runs=nextRuns(f);$('times').innerHTML=runs.length?runs.map(x=>'<div class="time"><span>'+x.toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:cronType==='quartz'?'2-digit':undefined,hour12:false})+'</span><span>'+['周日','周一','周二','周三','周四','周五','周六'][x.getDay()]+'</span></div>').join(''):'<div class="hint">未来一年内没有匹配的执行时间</div>'}catch(e){$('times').innerHTML='<div class="hint">无法计算执行时间</div>'}}
function setPreset(p){let presets={everyMinute:['*','*','*','*','*'],every5:['*/5','*','*','*','*'],hourly:['0','*','*','*','*'],daily:['0','9','*','*','*'],weekday:['0','9','*','*','1-5'],weekly:['0','9','*','*','1'],monthly:['0','9','1','*','*']};let f=presets[p];if(cronType==='quartz'){let map={everyMinute:['0','*','*','?','*','*'],every5:['0','*/5','*','?','*','*'],hourly:['0','0','*','?','*','*'],daily:['0','0','9','?','*','*'],weekday:['0','0','9','?','*','2-6'],weekly:['0','0','9','?','*','2'],monthly:['0','0','9','1','*','?']};quartz.forEach((d,i)=>assign(d.key,map[p][i],d))}else common.forEach((d,i)=>assign(d.key,f[i],d));document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.dataset.preset===p));renderFields()}
function assign(k,v,d){let s=state[k];if(v==='*')Object.assign(s,{mode:'every',a:1,b:d.min});else if(v==='?')Object.assign(s,{mode:'question',a:1,b:d.min});else if(v.includes('/'))Object.assign(s,{mode:'step',a:Number(v.split('/')[1]),b:0});else if(v.includes('-')){let [a,b]=v.split('-').map(Number);Object.assign(s,{mode:'range',a,b})}else Object.assign(s,{mode:'specific',a:Number(v),b:Number(v)})}
$('presets').addEventListener('click',e=>{let b=e.target.closest('[data-preset]');if(b)setPreset(b.dataset.preset)});
$('cronType').addEventListener('change',e=>{cronType=e.target.value;document.querySelector('.card-head .sub').textContent=cronType==='unix'?'标准 5 段格式':'Quartz 6 段格式';document.querySelector('.next h3').innerHTML='接下来 5 次执行时间 <span class="sub">（本地时区）</span>';setPreset('everyMinute')});
$('raw').addEventListener('change',()=>{try{let {f}=validCron($('raw').value);$('cron').textContent=f.join(' ');$('parts').innerHTML=f.map((x,i)=>'<div class="part"><b>'+x+'</b>'+defs()[i].title+'</div>').join('');$('desc').textContent=(cronType==='quartz'?'Quartz 六段表达式：':'Unix 五段表达式：')+f.join(' ');let runs=nextRuns(f);$('times').innerHTML=runs.map(x=>'<div class="time"><span>'+x.toLocaleString('zh-CN',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:cronType==='quartz'?'2-digit':undefined,hour12:false})+'</span></div>').join('');$('status').textContent='表达式有效';$('status').style.color='var(--green)'}catch(e){$('status').textContent=e.message;$('status').style.color='#ff9a9a'}});
$('copy').addEventListener('click',async()=>{try{await navigator.clipboard.writeText($('cron').textContent);$('status').textContent='已复制到剪贴板';$('status').style.color='var(--green)'}catch(e){$('raw').select();document.execCommand('copy');$('status').textContent='已复制'}});$('reset').addEventListener('click',()=>setPreset('everyMinute'));setPreset('everyMinute');
</script></body></html>
